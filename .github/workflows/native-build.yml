name: Build HODOR native apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native-app/**"
      - "index.html"
      - "app.js"
      - "style.css"
      - ".github/workflows/native-build.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npm run copy:web
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add Android camera and location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='<application'
          perms='''<uses-permission android:name="android.permission.CAMERA" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          '''
          if 'android.permission.CAMERA' not in s:
              s=s.replace(marker,perms+marker,1)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HODOR-Android-debug-APK
          path: native-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-14
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - run: npm install
      - run: npm run copy:web
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Add iOS permission descriptions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'يستخدم HODOR الكاميرا لمسح رمز QR الخاص بالحضور والانصراف داخل المكتبة.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'يستخدم HODOR موقعك للتحقق من وجودك داخل المكتبة عند تسجيل الحضور والانصراف.'" ios/App/App/Info.plist || true
      - name: Build iOS simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: HODOR-iOS-Simulator-App
          path: native-app/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
